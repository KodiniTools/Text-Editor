    # ========== TEXTEDITOR (Static SPA, kein Backend, kein Port) ==========
    # Einfuegen im Server-Block von /etc/nginx/sites-enabled/kodinitools.com
    # (z. B. direkt nach dem COLLAGE-MAKER-Block).
    # Webroot: /var/www/kodinitools.com/texteditor/  ->  https://kodinitools.com/texteditor/

    # /texteditor (ohne Slash) -> /texteditor/
    location = /texteditor {
        return 301 /texteditor/;
    }

    # Vite-Assets mit Content-Hash im Dateinamen -> 1 Jahr immutable
    location ^~ /texteditor/assets/ {
        alias /var/www/kodinitools.com/texteditor/assets/;
        expires 1y;
        add_header Cache-Control          "public, immutable" always;
        add_header X-Content-Type-Options "nosniff"           always;
        access_log off;
        try_files $uri =404;
    }

    # Eigene Schriften unter /var/www/kodinitools.com/public/fonts/
    # Ohne diesen Block werden die Dateien zwar ausgeliefert (sie liegen im
    # Webroot), aber ohne Cache-Header -- der Browser laedt die Schrift dann bei
    # jedem Seitenaufruf neu. Der bestehende /fonts/-Block trifft hier nicht zu,
    # weil er auf /var/www/kodinitools.com/fonts/ zeigt.
    location ^~ /public/fonts/ {
        expires 1y;
        add_header Cache-Control            "public, immutable" always;
        add_header Access-Control-Allow-Origin "*"              always;
        add_header X-Content-Type-Options    "nosniff"          always;
        access_log off;
        try_files $uri =404;
    }

    # Web-App-Manifest mit korrektem MIME-Typ ausliefern (nginx kennt
    # .webmanifest von Haus aus nicht -> sonst application/octet-stream).
    location = /texteditor/site.webmanifest {
        alias /var/www/kodinitools.com/texteditor/site.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }

    # SPA: index.html kurz cachen, History-Routen auf index.html zurueckfallen
    location ^~ /texteditor/ {
        alias /var/www/kodinitools.com/texteditor/;
        index index.html;

        # add_header in dieser location ueberschreibt die Server-Header -> erneut einbinden
        include /etc/nginx/snippets/kodini-security.conf;

        add_header Cache-Control          "public, max-age=60, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"                             always;

        try_files $uri $uri/ /texteditor/index.html;
    }
